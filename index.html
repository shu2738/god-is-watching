<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신이 보고 있다 (팝콘 들고) · 세계 기록</title>
<meta name="description" content="여덟 종족이 사는 대륙과 그 위의 사람들. 신이 보고 있다 (팝콘 들고) 세계 기록.">
<meta property="og:title" content="신이 보고 있다 (팝콘 들고)">
<meta property="og:image" content="https://shu2738.github.io/god-is-watching/img/cover.webp">
<link rel="icon" href="img/logo_v3.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f2e8; --bg2:#efe6d4; --card:#fffcf5; --line:#e4d6b8;
  --ink:#2f2619; --mute:#857660; --gold:#b8903f; --gold2:#d9b86a; --deep:#1c2233;
  --S:#c9962a; --A:#b8485a; --B:#4a72b8; --C:#3d8f6a; --D:#8b8596;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:15px/1.75 "Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}

/* header */
#hdr{position:fixed;inset:0 0 auto;z-index:50;display:flex;align-items:center;gap:36px;padding:14px clamp(16px,4vw,52px);transition:background .35s,box-shadow .35s}
#hdr.solid{background:rgba(247,242,232,.9);backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--line)}
.brand img{height:46px;width:auto;filter:drop-shadow(0 1px 2px rgba(60,40,10,.45))}
nav{display:flex;gap:clamp(14px,2.4vw,30px);font-family:"Noto Serif KR",serif;font-weight:600;font-size:14.5px;letter-spacing:.04em}
nav a{position:relative;padding:4px 0;color:var(--ink);opacity:.82;transition:opacity .2s}
nav a::after{content:"";position:absolute;left:50%;right:50%;bottom:-2px;height:1px;background:var(--gold);transition:.25s}
nav a:hover,nav a.on{opacity:1}
nav a:hover::after,nav a.on::after{left:0;right:0}
@media(max-width:820px){#hdr{gap:16px;padding:10px 14px}.brand img{height:34px}nav{gap:14px;font-size:13px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}}

/* hero */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;background:linear-gradient(180deg,#c9ddf0 0%,#d9e7f4 55%,#eef0ee 85%,var(--bg) 100%)}
.hero .bgimg{position:absolute;right:0;top:0;height:100%;aspect-ratio:832/1216;max-width:70%}
.hero .bgimg img{width:100%;height:100%;object-fit:cover;object-position:top;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%),linear-gradient(180deg,#000 72%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0,#000 30%),linear-gradient(180deg,#000 72%,transparent 100%);mask-composite:intersect}
.hero .in{position:relative;z-index:2;margin-left:clamp(20px,7vw,130px);width:min(600px,48vw);text-align:center;padding-top:50px}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-family:"Noto Serif KR",serif;font-size:12px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase}
.eyebrow::before,.eyebrow::after{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--gold2))}
.eyebrow::after{transform:scaleX(-1)}
.hero h1.logo{margin:10px 0 6px;line-height:0}
.hero h1.logo img{width:100%;height:auto;filter:drop-shadow(0 2px 2px rgba(90,60,20,.35)) drop-shadow(0 10px 26px rgba(70,90,120,.25))}
.hero .lead{font-family:"Noto Serif KR",serif;font-size:16.5px;line-height:1.9;color:#3a3226;margin:4px auto 30px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;padding:12px 32px;border-radius:0;font-family:"Noto Serif KR",serif;font-weight:600;letter-spacing:.22em;font-size:13px;border:1px solid rgba(28,34,51,.55);color:var(--deep);background:transparent;transition:.3s}
.btn:hover{background:var(--deep);border-color:var(--deep);color:#f4ecd8}
.btn.fill{background:var(--deep);border-color:var(--deep);color:#f4ecd8}
.btn.fill:hover{background:#2a3350;border-color:#2a3350}
@media(max-width:820px){
  .hero{display:block;min-height:auto;padding-top:0;background:var(--bg)}
  .hero .bgimg{position:relative;max-width:none;width:100%;height:auto;aspect-ratio:832/1000}
  .hero .bgimg img{-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent 100%);mask-image:linear-gradient(180deg,#000 70%,transparent 100%)}
  .hero .in{margin:-90px auto 0;width:100%;padding:0 22px 56px}
  .hero .lead{font-size:14.5px;margin-bottom:22px}
}

/* sections */
section{padding:100px clamp(16px,5vw,64px);max-width:1280px;margin:0 auto}
.sh{text-align:center;margin-bottom:44px}
.sh h2{font-family:"Noto Serif KR",serif;font-weight:900;font-size:clamp(28px,4vw,40px);letter-spacing:.04em;margin:8px 0 6px}
.sh p{color:var(--mute);font-size:14.5px}
.orn{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--gold2);margin:16px auto 0;max-width:520px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.orn span{width:8px;height:8px;transform:rotate(45deg);border:1px solid var(--gold)}

/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
.mapframe{position:relative;background:#141a28;padding:8px;border-radius:6px;box-shadow:0 24px 50px rgba(28,34,51,.22)}
.map{position:relative;border-radius:3px;overflow:hidden}
.map>img{width:100%;height:auto}
.map::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px rgba(10,14,24,.45)}
.pin{position:absolute;z-index:2;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(20,26,40,.82);border:1.5px solid rgba(255,255,255,.75);box-shadow:0 3px 10px rgba(0,0,0,.45);transition:transform .2s,background .2s,border-color .2s}
.pin .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.pin .lb{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font-family:"Noto Serif KR",serif;font-size:12px;font-weight:600;color:#f4ecd8;background:rgba(20,26,40,.92);border:1px solid rgba(255,255,255,.18);padding:3px 10px;white-space:nowrap;letter-spacing:.04em;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .2s}
.pin:hover{transform:translate(-50%,-50%) scale(1.12);z-index:3}
.pin:hover .lb,.pin.on .lb{opacity:1}
.pin.on{z-index:4;background:#f4ecd8;border-color:#fff;transform:translate(-50%,-50%) scale(1.18)}
.pin.on .dot{background:#141a28;box-shadow:none}
.maphint{text-align:center;font-size:12.5px;color:var(--mute);margin-top:10px}
.side{background:var(--card);border:1px solid var(--line);position:sticky;top:84px;overflow:hidden;border-radius:6px}
.side .top{position:relative;cursor:zoom-in}
.side .rimg{aspect-ratio:16/10;object-fit:cover;width:100%}
.side .top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(16,20,32,.85))}
.side .cap{position:absolute;left:20px;right:20px;bottom:16px;z-index:1;color:#fff}
.side .tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.16em;color:#f0dcae}
.side .tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.side h3{font-family:"Noto Serif KR",serif;font-size:25px;line-height:1.3;margin-top:2px;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.side .body{padding:18px 20px 20px}
.side p{font-size:14px;color:#544735;border-left:2px solid var(--c);padding-left:14px}
.side h4{margin:20px 0 10px;font-size:11.5px;color:var(--mute);letter-spacing:.14em;font-weight:500}
.who{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.who button{display:flex;align-items:center;gap:8px;text-align:left;background:var(--bg);padding:6px;border:1px solid var(--line);border-radius:4px;transition:.2s}
.who button:hover{border-color:#b9a986;background:#fff}
.who img{width:40px;height:40px;object-fit:cover;border-radius:3px}
.who span{font-size:13px;font-weight:700;line-height:1.25}.who small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.empty{font-size:13px;color:var(--mute);padding:12px;border:1px dashed var(--line);text-align:center;border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.legend button{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 10px;border:1px solid var(--line);background:#fff;border-radius:20px;transition:.2s}
.legend button::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.legend button:hover{border-color:var(--deep)}
@media(max-width:900px){
  .mapwrap{grid-template-columns:1fr;gap:14px}
  .mapframe{padding:4px;border-radius:4px}
  .pin{width:22px;height:22px;border-width:1px}
  .pin .dot{width:7px;height:7px}
  .pin .lb{font-size:11px;padding:2px 7px;top:calc(100% + 4px)}
  .side{position:static}
}

/* places */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.place{position:relative;overflow:hidden;aspect-ratio:3/2;border:1px solid var(--line);background:var(--card);padding:5px;transition:.3s}
.place:hover{box-shadow:0 14px 30px rgba(120,90,40,.15)}
.place img{width:100%;height:100%;object-fit:cover;transition:.5s}
.place:hover img{transform:scale(1.04)}
.place span{position:absolute;left:5px;right:5px;bottom:5px;padding:26px 14px 10px;text-align:left;font-family:"Noto Serif KR",serif;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(transparent,rgba(20,18,14,.72))}
.place small{display:block;font-family:"Noto Sans KR";font-weight:400;font-size:11px;opacity:.85;letter-spacing:.08em}


/* monsters */
.mgrid{display:grid;align-items:start;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.mon{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);padding:5px;transition:.3s}
.mon:hover{transform:translateY(-4px);box-shadow:0 16px 32px rgba(120,90,40,.14)}
.mon .ph{aspect-ratio:3/2;overflow:hidden;background:var(--bg2)}
.mon .ph img{width:100%;height:100%;object-fit:cover;transition:.5s}
.mon:hover .ph img{transform:scale(1.04)}
.mon .tx{padding:10px 8px 8px}
.mon h3{font-family:"Noto Serif KR",serif;font-size:17px;display:flex;align-items:center;gap:7px}
.mon .hb{font-size:12px;color:var(--gold);margin:2px 0 4px}
.mon p{font-size:13px;color:#544735;line-height:1.6}

/* people */
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:26px}
.chip{padding:5px 16px;border:1px solid var(--line);background:var(--card);font-size:13.5px;transition:.2s}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--deep);color:#f3e6c6;border-color:var(--deep)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.card{text-align:left;background:var(--card);border:1px solid var(--line);padding:5px;transition:.3s}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 32px rgba(120,90,40,.14)}
.card .ph{aspect-ratio:4/5;overflow:hidden;background:var(--bg2)}
.card .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;transition:.5s}
.card:hover .ph img{transform:scale(1.04)}
.card .bar{height:2px;background:var(--c);margin:0 0 0}
.card .tx{padding:10px 8px 8px}
.card h3{font-family:"Noto Serif KR",serif;font-size:17px;display:flex;align-items:center;gap:7px}
.gr{font-family:"Noto Sans KR";font-size:10.5px;font-weight:700;color:#fff;background:var(--g);padding:0 6px;line-height:17px}
.card .meta{font-size:12px;color:var(--mute)}
.card .at{font-size:12px;color:var(--gold)}
.count{text-align:center;color:var(--mute);margin-top:20px;font-size:13px}

/* webtoon */
.toon{max-width:720px;margin:0 auto;box-shadow:0 20px 50px rgba(28,34,51,.18)}
.toon .ep{background:var(--deep);color:#f4ecd8;text-align:center;font-family:"Noto Serif KR",serif;letter-spacing:.3em;font-size:13px;padding:12px}
.toon img{width:100%;height:auto;display:block}
@media(max-width:820px){#webtoon{padding-left:0;padding-right:0}.toon{box-shadow:none}}
.soon{text-align:center;background:var(--card);border:1px solid var(--line);padding:56px 20px;color:var(--mute);position:relative}
.soon::before{content:"";position:absolute;inset:6px;border:1px solid rgba(201,160,80,.22)}
.soon b{display:block;font-family:"Noto Serif KR",serif;font-size:22px;color:var(--ink);margin-bottom:4px}

footer{text-align:center;padding:44px 20px 54px;color:var(--mute);font-size:12.5px;letter-spacing:.06em}
footer .orn{margin-bottom:18px}

/* dialogs */
dialog{margin:auto;border:0;background:var(--card);color:var(--ink);width:min(820px,94vw);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,22,30,.6);backdrop-filter:blur(4px)}
.dlg-x{position:sticky;top:10px;float:right;margin:10px 10px -46px 0;width:36px;height:36px;border-radius:50%;background:rgba(255,252,245,.92);font-size:22px;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.dlg-img img{width:100%;height:auto}
.faces{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;background:var(--bg2)}
.faces button{flex:0 0 auto;width:70px;overflow:hidden;border:1px solid transparent;background:#fff;padding:2px}
.faces button.on{border-color:var(--gold)}
.faces img{aspect-ratio:1/1;object-fit:cover}
.faces span{display:block;font-size:11px;text-align:center}
.dlg-body,.pd{padding:20px 24px 26px}
.dlg-body h3,.pd h3{font-family:"Noto Serif KR",serif;font-size:26px;display:flex;align-items:center;gap:8px}
.dlg-body .sub{color:var(--mute);font-size:13px;margin-bottom:10px}
.dlg-body p,.pd p{font-size:15px;color:#3f3427;margin-bottom:14px}
.pers{margin:10px 0 12px;font-size:14px;line-height:1.7;background:var(--bg);border-left:3px solid var(--gold);padding:8px 12px}
.pers b{display:block;font-size:11px;color:var(--mute);font-weight:500;letter-spacing:.1em}
.dl{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dl div{background:var(--bg);border:1px solid var(--line);padding:8px 12px}
.dl dt{font-size:11px;color:var(--mute)}
.dl dd{font-weight:700}
.dl a{color:var(--gold);cursor:pointer;text-decoration:underline}
</style>
</head>
<body>

<header id="hdr">
  <a class="brand" href="#"><img src="img/logo_v3.webp" alt="신이 보고 있다 (팝콘 들고)"></a>
  <nav id="nav">
    <a href="#webtoon">웹툰</a>
    <a href="#map">대륙 지도</a>
    <a href="#people">인물 도감</a>
    <a href="#monsters">마물 도감</a>
  </nav>
</header>

<div class="hero">
  <div class="bgimg" aria-hidden="true"><img src="img/god_watch.webp" alt=""></div>
  <div class="in">
    <div class="eyebrow">World Archive</div>
    <h1 class="logo"><img src="img/logo_v3.webp" alt="신이 보고 있다 (팝콘 들고)"></h1>
    <p class="lead">신이 내려다보는 세계.<br>세계수 아래 여덟 종족이 살아가는 대륙의 기록.</p>
    <div class="btns">
      <a class="btn fill" href="#map">지도 보기</a>
      <a class="btn" href="#people">인물 보기</a>
    </div>
  </div>
</div>

<section id="webtoon">
  <div class="sh">
    <div class="eyebrow">Webtoon</div>
    <h2>웹툰</h2>
    <div class="orn"><span></span></div>
  </div>
  <div class="toon"><div class="ep">프롤로그</div><img src="img/toon_01.webp?v=3" alt="프롤로그 1" width="1000" height="7101"><img src="img/toon_02.webp?v=3" alt="프롤로그 2" width="1000" height="7072" loading="lazy"><img src="img/toon_03.webp?v=3" alt="프롤로그 3" width="1000" height="7394" loading="lazy"></div>
</section>


<section id="map">
  <div class="sh">
    <div class="eyebrow">Continent</div>
    <h2>대륙 지도</h2>
    <p>지명을 누르면 그곳에 사는 인물을 볼 수 있어요</p>
    <div class="orn"><span></span></div>
  </div>
  <div class="mapwrap">
    <div><div class="mapframe"><div class="map" id="mapbox"><img src="img/map.webp" alt="대륙 지도" width="1216" height="832"></div></div></div>
    <aside class="side" id="side"></aside>
  </div>
</section>


<section id="people">
  <div class="sh">
    <div class="eyebrow">Characters</div>
    <h2>인물 도감</h2>
    <p>카드를 누르면 감정별 모습과 정보를 볼 수 있어요</p>
    <div class="orn"><span></span></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <p class="count" id="count"></p>
</section>

<section id="monsters">
  <div class="sh">
    <div class="eyebrow">Monsters</div>
    <h2>마물 도감</h2>
    <div class="orn"><span></span></div>
  </div>
  <div class="mgrid" id="mgrid"></div>
</section>



<dialog id="pdlg">
  <button class="dlg-x" id="pdlgx" aria-label="닫기">×</button>
  <div class="dlg-img"><img id="pimg" alt=""></div>
  <div class="pd"><h3 id="pname"></h3><p id="pdesc"></p><a class="btn" id="pmap">지도에서 보기</a></div>
</dialog>

<footer><div class="orn"><span></span></div>신이 보고 있다 (팝콘 들고) · 세계 기록</footer>

<dialog id="dlg">
  <button class="dlg-x" id="dlgx" aria-label="닫기">×</button>
  <div class="dlg-img"><img id="dimg" alt=""></div>
  <div class="faces" id="faces"></div>
  <div class="dlg-body">
    <h3 id="dname"></h3>
    <div class="sub" id="dsub"></div>
    <p id="ddesc"></p>
    <p class="pers"><b>성격</b><span id="dpers"></span></p>
    <dl class="dl" id="ddl"></dl>
  </div>

<script>

 "초록 땋은 머리, 초록 눈. 후드 망토에 장궁. 나뭇가지에 앉아 내려다보는 궁수.", "male": 0, "emo": ["k", "s", "t", "h", "b", "d", "q", "f"], "reg": "adv", "pers": "조용하고 관찰력이 뛰어나다. 높은 곳에서 상황을 지켜보다 정확히 한 발을 쏜다. 리네트와는 쌍둥이 자매."}, {"id": "c20", "name": "레온", "race": "인간", "aff": "모험가", "role": "전사", "attr": "대지 파괴", "grade": "B", "desc": "빨간 삐죽머리, 붉은 눈. 짝짝이 갑옷, 털 망토, 대형 도끼. 길드의 허세 많은 남자 전사.", "male": 1, "emo": ["k", "s", "t", "h", "d", "q", "f"], "reg": "adv", "pers": "허세가 심하고 목소리가 크다. 겉으로는 거칠지만 동료가 위험하면 제일 먼저 뛰어드는 의리파."}, {"id": "c21", "name": "이그니", "race": "용족", "aff": "화룡 화산", "role": "화룡", "attr": "용염(불)", "grade": "S", "desc": "붉은 웨이브 장발, 금안 세로동공, 용뿔과 꼬리. 붉은색과 금색 치파오풍 드레스. 보물 위 오만한 화룡.", "male": 0, "emo": ["k", "s", "t", "h", "b", "d", "q", "f"], "reg": "fire", "pers": "오만하고 탐욕스럽다. 보물과 반짝이는 것을 좋아하며, 자신보다 강한 존재를 인정하지 않는다."}, {"id": "c22", "name": "시엘", "race": "용족", "aff": "빙룡 설원", "role": "빙룡", "attr": "빙결 용술", "grade": "S", "desc": "은발 히메컷, 하늘색 눈, 흰 뿔. 흰색과 파란색 기모노풍 로브. 설산의 무표정한 빙룡.", "male": 0, "emo": ["k", "s", "t", "h", "b", "d", "q", "f"], "reg": "ice", "pers": "무표정하고 감정 표현이 적다. 세상일에 관심 없어 보이지만 약속은 반드시 지킨다."}, {"id": "c23", "name": "윈디", "race": "용족", "aff": "풍룡 하늘섬", "role": "풍룡", "attr": "폭풍(바람)", "grade": "A", "desc": "초록 부스스 단발, 아호게, 주황 눈, 날개. 크롭탑에 배기팬츠. 고기 뜯는 장난꾸러기 풍룡.", "male": 0, "emo": ["k", "s", "t", "h", "b", "d", "q", "f"], "reg": "wind", "pers": "자유분방하고 장난기 많다. 먹는 것에 진심이며, 하고 싶은 대로 날아다닌다."}, {"id": "c24", "name": "야에", "race": "용족", "aff": "흑룡 암벽", "role": "흑룡", "attr": "암흑 검술", "grade": "A", "desc": "흑발 하이 포니테일, 보라 눈, 검은 뿔. 검보라 무사 갑옷에 하카마, 카타나. 신사의 진지한 흑룡.", "male": 0, "emo": ["k", "s", "t", "h", "b", "d", "q", "f"], "reg": "dark", "pers": "진지하고 예의 바른 무인. 수련과 명예를 무엇보다 중요하게 여긴다."}, {"id": "c25", "name": "아우룸", "race": "용족", "aff": "용왕의 영봉", "role": "용왕", "attr": "황금 빛", "grade": "S", "desc": "금발 로우 포니테일, 금안, 금빛 뿔. 흰색과 금색 왕의 로브, 왕관. 옥좌의 남자 용왕.", "male": 1, "emo": ["k", "s", "t", "h", "d", "q", "f"], "reg": "gold", "pers": "위엄 있고 관대하다. 모든 용을 다스리는 왕답게 여유롭지만, 분노하면 아무도 막지 못한다."}, {"id": "c26", "name": "그롬", "race": "드워프", "aff": "드워프 왕국", "role": "장인", "attr": "용암 단조", "grade": "A", "desc": "회색 머리, 땋은 수염, 근육질. 가죽 앞치마, 고글. 대장간의 무뚝뚝한 장인.", "male": 1, "emo": ["k", "s", "t", "h", "d", "q", "f"], "reg": "dwarf", "pers": "무뚝뚝하고 고집이 세다. 말 대신 망치로 대답하는 장인 기질."}, {"id": "c27", "name": "페니", "race": "드워프", "aff": "드워프 왕국", "role": "정비 조수", "attr": "기계·뇌전", "grade": "C", "desc": "빨간 양갈래 땋은 머리, 주근깨. 멜빵바지, 공구 벨트, 고글. 렌치 든 정비 조수.", "male": 0, "emo": ["k", "s", "t", "h", "b", "d", "q", "f"], "reg": "dwarf", "pers": "활발하고 손재주가 좋다. 고장 난 걸 보면 참지 못하고 뜯어 보는 기계광."}, {"id": "c28", "name": "젬마", "race": "드워프", "aff": "드워프 왕국", "role": "세공 조수", "attr": "보석 마법", "grade": "D", "desc": "갈색 단발, 파란 눈. 가죽 앞치마, 두건. 돋보기로 보석을 보는 세공 조수.", "male": 0, "emo": ["k", "s", "t", "h", "b", "d", "q", "f"], "reg": "dwarf", "pers": "수줍고 꼼꼼하다. 작은 보석 하나도 허투루 보지 않는 집중력의 소유자."}, {"id": "c29", "name": "플로라", "race": "엘프", "aff": "엘프의 숲", "role": "귀족 아가씨", "attr": "자연(식물)", "grade": "A", "desc": "금발 장발에 화관, 초록 눈. 흰색과 초록색 엘프 드레스, 서클릿. 세계수 아래 상냥한 엘프.", "male": 0, "emo": ["k", "s", "t", "h", "b", "d", "q", "f"], "reg": "elf", "pers": "상냥하고 기품 있다. 숲과 생명을 아끼며, 다투는 사람들 사이를 부드럽게 중재한다."}, {"id": "c30", "name": "네아", "race": "엘프", "aff": "엘프의 숲", "role": "숲 감시자", "attr": "바람 궁술", "grade": "B", "desc": "은발 단발, 파란 눈. 남색 엘프 레인저 재킷에 짧은 흰 망토, 장궁. 경계심 많은 숲 감시자.", "male": 0, "emo": ["k", "s", "t", "h", "b", "d", "q", "f"], "reg": "elf", "pers": "경계심이 강하고 말이 짧다. 외부인을 쉽게 믿지 않지만 한번 믿은 상대는 끝까지 지킨다."}, {"id": "c31", "name": "리프", "race": "엘프", "aff": "엘프의 숲", "role": "정원사", "attr": "꿈 마법", "grade": "C", "desc": "연두 더블번, 보라 눈. 잎 장식 마법 로브. 물뿌리개 든 밝은 정원사.", "male": 0, "emo": ["k", "s", "t", "h", "b", "d", "q", "f"], "reg": "elf", "pers": "밝고 해맑다. 식물에게 말을 거는 습관이 있는 천진난만한 정원사."}, {"id": "c32", "name": "엘로스", "race": "엘프", "aff": "엘프의 숲", "role": "귀족", "attr": "별빛 정령술", "grade": "A", "desc": "백금발 장발, 금안. 흰색과 초록색 귀족 로브, 은 서클릿. 차분한 남자 엘프 귀족.", "male": 1, "emo": ["k", "s", "t", "h", "d", "q", "f"], "reg": "elf", "pers": "차분하고 이성적이다. 귀족다운 품위를 지키며 신중하게 말을 고른다."}, {"id": "c36", "name": "쿠로", "race": "수인", "aff": "수인 부락", "role": "고양이", "attr": "환영(분신)", "grade": "D", "desc": "고양이 수인. 흑발 단발, 초록 눈. 카페 웨이트리스 복장. 쟁반 든 새침한 점원.", "male": 0, "emo": ["k", "s", "t", "h", "b", "d", "q", "f"], "reg": "beast", "pers": "새침하고 도도하다. 무심한 척하지만 단골손님은 은근히 챙긴다."}, {"id": "c37", "name": "유키", "race": "수인", "aff": "수인 부락", "role": "토끼", "attr": "달빛 마법", "grade": "D", "desc": "토끼 수인. 흰 트윈테일, 붉은 눈. 흰색과 분홍색 드레스. 나무 뒤에서 훔쳐보는 수줍은 아이.", "male": 0, "emo": ["k", "s", "t", "h", "b", "d", "q", "f"], "reg": "beast", "pers": "수줍음이 많고 겁이 많다. 낯을 가리지만 친해지면 졸졸 따라다닌다."}, {"id": "c40", "name": "타이가", "race": "수인", "aff": "수인 부락", "role": "호랑이", "attr": "뇌전 격투", "grade": "B", "desc": "호랑이 수인 남자. 흰 삐죽머리, 파란 눈. 민소매에 무술 바지, 붕대. 도장의 자신만만한 무투가.", "male": 1, "emo": ["k", "s", "t", "h", "d", "q", "f"], "reg": "beast", "pers": "자신만만하고 호승심이 강하다. 강한 상대를 보면 일단 대련부터 신청하는 무투가."}, {"id": "c41", "name": "아스타", "race": "마족", "aff": "마족령", "role": "마왕", "attr": "혼돈(흑염)", "grade": "S", "desc": "마왕. 흑발 장발, 붉은 눈, 큰 뿔. 검은색과 진홍색 드레스에 갑옷, 망토, 왕관. 옥좌에서 다리 꼬고 앉음.", "male": 0, "emo": ["k", "s", "t", "h", "b", "d", "q", "f"], "reg": "demon", "pers": "오만하고 여유롭다. 모든 것을 내려다보는 절대자지만, 흥미로운 상대에게는 의외로 관대하다."}, {"id": "c42", "name": "멜리아", "race": "마족", "aff": "마족령", "role": "서큐버스", "attr": "매혹(정신)", "grade": "A", "desc": "서큐버스. 분홍 웨이브 장발, 하트 동공. 검은 고딕 드레스, 초커. 손가락을 입에 댄 유혹형.", "male": 0, "emo": ["k", "s", "t", "h", "b", "d", "q", "f"], "reg": "demon", "pers": "요염하고 장난스럽다. 상대의 마음을 흔드는 걸 즐기지만 진심은 쉽게 보여 주지 않는다."}, {"id": "c43", "name": "네네", "race": "마족", "aff": "마족령", "role": "서큐버스", "attr": "꿈 마법", "grade": "C", "desc": "서큐버스. 하늘색 트윈테일, 보라 눈. 프릴 검보라 드레스. 윙크하며 날아다니는 장난꾸러기.", "male": 0, "emo": ["k", "s", "t", "h", "b", "d", "q", "f"], "reg": "demon", "pers": "장난꾸러기에 천방지축. 꿈속에 몰래 들어가 놀래 주는 게 취미."}, {"id": "c52", "name": "마리나", "race": "해양족", "aff": "해저 왕국", "role": "인어 공주", "attr": "물 마법", "grade": "A", "desc": "인어 공주. 푸른 웨이브 장발, 물빛 눈. 인어 꼬리, 조개 장식, 진주 목걸이, 티아라. 바위 위 /* map */

  b.style.cssText=`left:${r.x}%;top:${r.y}%;--c:${r.c}`;
  b.innerHTML=`<span class="lb">${r.n}</span><span class="dot"></span>`;

function pick(k){
  const r = RMAP[k];
  document.querySelectorAll('.pin').forEach(p=>p.classList.toggle('on',p.dataset.k===k));
  const ps = PEOPLE.filter(p=>p.reg===k);
  $('#side').style.setProperty('--c',r.c);
  $('#side').innerHTML = `<div class="top" onclick="openPlace('${r.k}')"><img class="rimg" src="img/r_${r.k}.webp" alt="${r.n}"><div class="cap"><span class="tag">${r.race}</span><h3>${r.n}</h3></div></div><div class="body"><p>${r.d}</p>
    <h4>사는 인물 ${ps.length}</h4>
    ${ps.length?`<div class="who">${ps.map(p=>`<button data-id="${p.id}"><img src="${img(p,'th')}" alt="${p.name}" loading="lazy"><span>${p.name}<small>${p.role}</small></span></button>`).join('')}</div>`:'<div class="empty">아직 등록된 인물이 없어요.</div>'}
    <div class="legend">${REGIONS.filter(x=>x.k!==k).map(x=>`<button style="--c:${x.c}" data-k="${x.k}">${x.n}</button>`).join('')}</div></div>`;
  $('#side').querySelectorAll('.who button').forEach(b=>b.onclick=()=>open(b.dataset.id));
  $('#side').querySelectorAll('.legend button').forEach(b=>b.onclick=()=>pick(b.dataset.k));
}

function draw(){
  const ps = PEOPLE.filter(p=>cur==='전체'||grp(p)===cur);
  $('#grid').innerHTML = ps.map(p=>{
    const r=RMAP[p.reg];
    return `<button class="card" data-id="${p.id}" style="--c:${r.c}">
      <div class="ph"><img src="${img(p,'tc')}" alt="${p.name}" loading="lazy"></div><div class="bar"></div>
      <div class="tx"><h3>${p.name}<span class="gr" style="--g:${GC[p.grade]}">${p.grade}</span></h3>
      <div class="meta">${p.race} · ${p.aff} · ${p.role}</div><div class="at">${p.attr}</div></div></button>`;
  }).join('');
  $('#grid').querySelectorAll('.card').forEach(b=>b.onclick=()=>open(b.dataset.id));
  $('#count').textContent = `${ps.length}명`;
}

  $('#faces').innerHTML=p.emo.map(c=>`<button class="${c==='k'?'on':''}" data-c="${c}"><img src="${img(p,c)}" alt="${p.name} ${EMO[c]}" loading="lazy"><span>${EMO[c]}</span></button>`).join('');

  $('#dsub').textContent=`${p.race} · ${p.aff} · ${p.role}`;
